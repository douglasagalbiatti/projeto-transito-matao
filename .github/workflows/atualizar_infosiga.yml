name: Atualização Automática InfoSiga SP

on:
  # Agendamento: Dias 28 a 31 de cada mês às 23:00 UTC (20:00 Horário de Brasília)
  schedule:
    - cron: '0 23 28-31 * *'

  # Permite disparar manualmente com 1 clique pela aba 'Actions' no GitHub
  workflow_dispatch:
    inputs:
      forcar_execucao:
        description: 'Forçar execução mesmo que não seja o último dia do mês?'
        required: true
        type: boolean
        default: true

# Permissão essencial para que o robô do GitHub Actions possa commitar os novos CSVs
permissions:
  contents: write

jobs:
  etl-infosiga:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout do Repositório
        uses: actions/checkout@v4

      - name: 2. Validar se hoje é o último dia do mês
        id: checar_data
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.forcar_execucao }}" = "true" ]; then
            echo "✅ Disparo manual forçado. Prosseguindo com o pipeline..."
            echo "deve_executar=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          DIA_AMANHA=$(date -d tomorrow +%d)
          if [ "$DIA_AMANHA" != "01" ]; then
            echo "ℹ️ Hoje não é o último dia do mês (amanhã é dia $DIA_AMANHA). Pipeline suspenso."
            echo "deve_executar=false" >> "$GITHUB_OUTPUT"
          else
            echo "🎯 Confirmado: Hoje é o último dia do mês! Prosseguindo com a extração..."
            echo "deve_executar=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 3. Configurar Ambiente Python
        if: steps.checar_data.outputs.deve_executar == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 4. Instalar Dependências Mínimas
        if: steps.checar_data.outputs.deve_executar == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: 5. Verificar Novos Dados no InfoSiga
        if: steps.checar_data.outputs.deve_executar == 'true'
        run: |
          python scripts/atualizar_dados_infosiga.py --verificar

      - name: 6. Executar Pipeline ETL Automático
        if: steps.checar_data.outputs.deve_executar == 'true'
        run: |
          python scripts/atualizar_dados_infosiga.py --automatico

      - name: 7. Commitar e Enviar Novos Dados ao Repositório
        if: steps.checar_data.outputs.deve_executar == 'true'
        shell: bash
        run: |
          if git diff --quiet data/matao_limpo.csv output/relatorios/resumo_anual_matao.csv; then
            echo "✅ Nenhuma alteração encontrada nos dados. Base já estava 100% sincronizada."
          else
            echo "🚀 Novos dados detectados! Gravando commit no repositório..."
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add data/matao_limpo.csv output/relatorios/resumo_anual_matao.csv
            git commit -m "chore(data): atualização automática dos dados do InfoSiga [skip ci]"
            git push
            echo "🎉 Novos dados publicados no repositório com sucesso!"
          fi
